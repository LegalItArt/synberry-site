<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | SynBerry · SynItArt</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
:root{--bg:#0B1220;--surface:#152033;--text:#F5F7FA;--muted:#B6C2D1;--border:#33445C;--hold:#AEBBC8;--accent:#4ADE80;--on-accent:#0B1220;--wa:#6BD493;--wb:#FF5C70;--f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:18px/1.6 var(--f);word-break:keep-all}
main{max-width:640px;padding:48px 16px;display:grid;gap:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wm{font-family:"Noto Sans KR",var(--f);font-weight:900;font-size:28px}
.wm .hold{color:var(--hold);font-weight:700;font-size:.6em;margin-right:6px}.wm .wa{color:var(--wa)}.wm .wb{color:var(--wb)}.wm .of{color:var(--wb);font-size:.62em;margin:0 .14em}.wm .tm{color:var(--hold);font-size:.45em;vertical-align:super}
.code{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;letter-spacing:.08em}
h1{margin:0;font-size:36px;line-height:1.25}
p{margin:0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:8px}
a.btn{display:inline-flex;align-items:center;min-height:56px;padding:12px 24px;border-radius:12px;font-weight:700;font-size:20px;text-decoration:none;border:2px solid transparent}
.fill{background:var(--accent);color:var(--on-accent)}.line{border-color:var(--muted)!important;color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="wm"><span class="hold">SynItArt ·</span><span class="wa">Syn</span><span class="wb">Berry</span><span class="tm">™</span></div>
  <p class="code">404 · 길을 잘못 들었습니다</p>
  <h1>찾는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 아직 만들지 않은 페이지입니다. 처음 화면이나 SynItArt 출구 안내에서 다시 찾아 주세요.</p>
  <div class="btns"><a class="btn fill" href="/">SynBerry 처음으로 →</a><a class="btn line" href="https://synitart.com/#exits">다른 출구 보기</a></div>
</main>
</body>
</html>
